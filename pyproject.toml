[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "zohra-clipos"
version = "0.7.0"
description = "Safety-first control plane for AI-assisted short-form media operations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "alembic>=1.13,<2",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "PyJWT>=2.9,<3",
  "argon2-cffi>=23.1,<26",
  "httpx>=0.27,<1",
  "redis>=5.1,<7",
  "email-validator>=2.2,<3",
  "python-multipart>=0.0.20,<1",
  "cryptography>=43,<48",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4.1,<2",
  "pytest-cov>=5,<7",
  "asgi-lifespan>=2.1,<3",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
  "pip-audit>=2.7,<3",
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.hatch.build.targets.wheel]
packages = ["apps/api/clipos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["apps/api/tests"]
addopts = "-ra --strict-markers"
markers = [
  "unit: no external service required",
  "integration: local database/application integration",
  "provider: real external provider test (never run by default)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["apps/api"]
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"apps/api/clipos/api/**/*.py" = ["B008"]
"apps/api/clipos/config.py" = ["S105"]
"apps/api/clipos/schemas.py" = ["S105"]
"apps/api/tests/**/*.py" = ["S105", "S106"]

[tool.coverage.run]
source = ["apps/api/clipos"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
